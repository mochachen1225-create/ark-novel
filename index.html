/* Layout: one phone-width column; each screen fills the viewport. Titles use a 12px-grid pixel font (Fusion Pixel TC, subset and inlined); story text and UI use LXGW WenKai TC for readability */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --night:#1b1530;--panel:#272040;--ink:#f6f1ff;--dim:#d2c9ec;--ember:#ffb35c;--edge:#0e0a1c;
  --r-n:#a9a2bd;--r-r:#6aaeff;--r-sr:#c98bff;--r-ssr:#ffd34d;--term:#7fe8ff;
  --f-pixel:"PX","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-ui:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-prose:var(--f-ui);
  --f-num:"Press Start 2P","PX",monospace;
  color-scheme:dark;
}
html,body{height:100%}
*{font-synthesis:none}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-ui);font-weight:500;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none}
#app{height:100%;max-width:460px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.px-box{background:var(--panel);box-shadow:0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge);margin:3px}
button{font-family:var(--f-ui);font-weight:700;font-size:18px;color:var(--edge);background:var(--ember);border:0;padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 #b86f22,0 -3px 0 var(--edge),0 7px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge);margin:3px 3px 8px;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b86f22,0 -3px 0 var(--edge),0 4px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge)}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
button.ghost{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 #15102a,0 -3px 0 var(--edge),0 7px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge)}
#glossBtn.new{animation:gnew 1.2s ease-out 3}
@keyframes gnew{0%{background:var(--term);color:var(--edge)}100%{background:var(--panel);color:var(--ink)}}
button.small{font-size:14px;padding:6px 10px;margin:3px 3px 6px}
.eyebrow{font-size:13.5px;letter-spacing:.1em;color:var(--dim)}
.prose{font-family:var(--f-prose);font-weight:500;font-size:18px;line-height:1.85}
.note{font-size:14px;color:var(--dim);line-height:1.6;margin:0}
.term{color:var(--term);border-bottom:2px dotted var(--term)}
.tag{font-weight:700;font-size:14px;letter-spacing:.04em}
.t-n{color:var(--r-n)}.t-r{color:var(--r-r)}.t-sr{color:var(--r-sr)}.t-ssr{color:var(--r-ssr)}

/* gacha + card */
#s-gacha,#s-card,#s-chapter{align-items:center;justify-content:center;text-align:center;overflow-y:auto}
.logo{font-family:var(--f-pixel);font-size:36px;margin:0;font-weight:400;letter-spacing:.08em}
.machine-wrap{position:relative;width:216px;height:264px}
#machine{width:216px;height:264px}
.machine-wrap.shake{animation:shake .12s linear 6}
@keyframes shake{25%{transform:translateX(-4px) rotate(-1deg)}75%{transform:translateX(4px) rotate(1deg)}}
.capsule{position:absolute;left:84px;top:216px;width:48px;height:48px;border-radius:50%;background:linear-gradient(180deg,var(--r-r) 0 50%,#f1eafc 50% 100%);box-shadow:0 0 0 3px var(--edge);cursor:pointer;border:0;padding:0;margin:0}
.capsule.drop{animation:drop .9s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes drop{from{transform:translateY(-30px) scale(.4)}to{transform:translateY(54px) scale(1)}}
.capsule.wobble{animation:wob 1s ease-in-out infinite;transform:translateY(54px)}
@keyframes wob{0%,100%{transform:translateY(54px) rotate(-8deg)}50%{transform:translateY(54px) rotate(8deg)}}
.rates{width:100%;max-width:320px;padding:10px 14px;box-sizing:border-box;text-align:left;font-size:15px}
.rates .row{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:3px 0;align-items:center}
.rates .num{font-weight:700;font-variant-numeric:tabular-nums}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50;transition:opacity .25s}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .35s}
.card{width:100%;max-width:300px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;text-align:left;background:linear-gradient(180deg,#2c3a66,#272040 55%);animation:rise .6s ease-out}
@keyframes rise{from{transform:translateY(20px) scale(.92);opacity:.4}}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .portrait{align-self:center;width:160px;height:180px;background:repeating-linear-gradient(0deg,#33457a 0 6px,#2e3f72 6px 12px);box-shadow:0 0 0 3px var(--edge)}
.card h2{margin:0;font-size:24px;font-weight:400;font-family:var(--f-num)}
.card .role{font-size:15px;color:var(--dim)}
.card .quote{font-family:var(--f-prose);font-size:17px;margin:0}
.stats{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}
.stats dt{color:var(--dim)}.stats dd{margin:0}
.greyed{color:#7a7392;text-decoration:line-through}
#s-pro .big{font-family:var(--f-pixel);font-size:36px;letter-spacing:.08em}
#s-pro .prose{white-space:pre-line;min-height:9em}
.tbc{text-align:center;padding:8px 0 4px}.tbc .big{font-family:var(--f-pixel);font-size:24px;letter-spacing:.3em;color:var(--ember)}

#quitBox{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(8,6,18,.72);padding:16px}
#quitBox[hidden]{display:none}.qbox{max-width:340px;width:100%;padding:16px}
.tk-row{display:flex;justify-content:space-between;gap:12px;font-size:15px}.tk-row span{color:var(--dim)}
.tk-no{font-family:var(--f-num);font-weight:400;font-size:14px;color:var(--r-r)}
.tk-fine{font-size:12.5px;color:#9a92b8;margin-top:4px}
.cps{display:flex;flex-direction:column;gap:4px;align-items:stretch;width:100%;max-width:340px}
.cps .btnrow button{flex:1 1 100%}
.mychars{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:14px;color:var(--dim)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btnrow button{flex:1 1 140px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app">

  <div id="note" hidden><div class="nwrap"><div class="ncap" id="nCap"></div><div class="ncard" id="nCard"></div><div class="nmore">點一下繼續 ▼</div></div></div>
  <div id="quitBox" class="modal" hidden><div class="px-box qbox"><p class="prose" style="margin:0 0 10px">要離開這一局，回到轉蛋機嗎？</p><p class="note" style="margin:0 0 12px">已經玩過的章節，之後可以從「從這一幕重玩」接著玩。</p><div class="btnrow"><button id="quitYes">離開</button><button class="ghost" id="quitNo">繼續玩</button></div></div></div>

    <p class="prose" id="pText"></p>
    <div class="btnrow"><button id="pNext">下一頁</button><button class="ghost" id="pSkip">跳過</button></div>

      <div class="row"><span class="tag t-sr">SR</span><span id="rateSR">？？？</span><span class="num">2.5%</span></div>
      <div class="row"><span class="tag t-r">R</span><span id="rateR">？？？</span><span class="num">12%</span></div>

    <p class="note" id="tStats"></p>
    <div class="btnrow"><button class="small ghost" id="tPro">重看序章</button><button class="small ghost" id="tGloss" hidden>名詞圖鑑</button></div>

  <section class="screen" id="s-card" hidden>

      <div class="names">

        <label>AI 助理<input id="cLumiIn" maxlength="10" autocomplete="off" spellcheck="false"></label><button class="small ghost dice" data-roll="lumi" aria-label="隨機換一個 AI 名字">🎲</button>
      </div>
      <p class="quote" id="cQuote"></p>
      <dl class="stats" id="cStats"></dl>
    </div>
    <button id="toChapter">從頭開始</button>
    <div id="cCp" class="cps" hidden></div>

  <section class="screen" id="s-chapter" hidden>
    <p class="eyebrow" id="chEye"></p>

  </section>

  <section class="screen" id="s-game" hidden>
    <div class="hud"><span id="hudPlace">家</span><span class="hudr"><span class="time" id="hudTime">08:12</span><button class="small ghost" id="glossBtn" hidden>圖鑑</button><button class="small ghost" id="sndBtn">♪ 開</button><button class="small ghost speed">▶▶ 1x</button><button class="small ghost" id="quitBtn" aria-label="離開遊戲">✕</button></span></div>

<script>
const $=s=>document.querySelector(s);
const screens=[...document.querySelectorAll('.screen')];
function show(id){screens.forEach(s=>s.hidden=s.id!==id);if(id==='s-game'){fit();startLoop();}else stopLoop();}
const MEM={};const store={get(k,d){try{const v=localStorage.getItem(k);if(v!=null)return JSON.parse(v);}catch(e){}return k in MEM?JSON.parse(MEM[k]):d;},set(k,v){MEM[k]=JSON.stringify(v);try{localStorage.setItem(k,MEM[k]);}catch(e){}}};
const S={score:0,speed:store.get('ark-speed',1),gloss:new Set(store.get('ark-gloss',[])),endings:new Set(store.get('ark-endings',[])),lumi:false};
/* player-chosen names: swapped in wherever text reaches the screen */
const NAME_DEF={ivy:'Ivy',leo:'Leo',dict:'Darius',vale:'Adrian',noor:'Noor',lumi:'Lumi'};
const NAME_PAT={ivy:['Ivy'],leo:['Leo'],dict:['Darius Vey','D. Vey','Darius','Vey'],vale:['Adrian Vale','A. Vale','Adrian','Vale'],noor:['Noor Haddad','N. Haddad','Noor'],lumi:['Lumi']};
const NAME_POOL={ivy:['Ivy','Mia','Iris','Chloe','Hana','Joy','Tess','Vivian','Elsa','Maggie'],leo:['Leo','Kai','Ethan','Ray','Owen','Jay','Max','Sam','Ben','Tony'],
  dict:['Darius','Viktor','Magnus','Rodrigo','Anton','Basil','Otto','Casimir'],vale:['Adrian','Julian','Marcus','Silas','Damon','Felix','Hugo','Rex'],
  noor:['Noor','Lena','Yara','Mira','Ada','Sofia','Rina','Selma'],lumi:['Lumi','Pico','Mochi','Nova','Bibi','Echo','Kiki','Momo','Dot','Pipi']};
S.names=Object.assign({},NAME_DEF,store.get('ark-names',{}));
let NM_RE=null,NM_MAP={};
function nameRebuild(){NM_MAP={};const pats=[];for(const k in NAME_PAT){if(S.names[k]===NAME_DEF[k])continue;NAME_PAT[k].forEach(p=>{NM_MAP[p]=S.names[k];pats.push(p);});}

async function actNina(){
  if(F.nina){await say('Nina',{yes:'Miso 在我房間的床底下！',soft:'我刷好牙了！Miso 還是不出來。',no:'……'}[F.nina]);return;}
  const k=await ask('Nina','媽媽，Miso 又吐了。牠躲在床底下，一直不出來。',['「我們一起去看看。」','「牠可能是熱到了。妳先去刷牙，媽媽來看。」','「媽媽要遲到了，晚上再說好不好？」']);
  this.mark=false;
  if(k===0){F.nina='yes';add(2);await say('Nina','在我房間！快點！');}
  else if(k===1){F.nina='soft';add(1);await say('Nina','好……妳要看喔。');}
  else{F.nina='no';add(-1);await say('Nina','……好。');await narr('她低頭玩著制服上的扣子，沒有再說話。');}
}
async function actMiso(){
  if(F.misoOut){await narr('Miso 待在床底下最靠外面的地方，尾巴尖輕輕地動。');return;}
  this.mark=false;
  await narr('床底下有兩顆發光的眼睛。木地板被太陽曬得很燙。');
  const k=await ask(null,'你要怎麼做？',['趴下來，把手伸進去',F.nina==='yes'?'叫 Nina 去拿貓零食':'倒一點涼水在碗裡，放在床邊','拍一張照片，傳給獸醫']);
  if(k===0){F.misoOut=true;add(2);sfx.pop();await narr('你趴到地上，伸出手。Miso 聞了聞你的手指。牠沒有出來，但也沒有往裡面躲。');if(F.nina==='yes')await say('Nina','牠有聞妳耶。');}
  else if(k===1){F.misoOut=true;add(1);if(F.nina==='yes'){await say('Nina','來了來了！');await narr('Nina 搖了搖零食袋。Miso 的耳朵動了一下，往外挪了一點點。');}else await narr('你把碗放在床邊。過了一會兒，你聽見很小的舔水聲。');}
  else{add(-1);await narr('你拍了一張，閃光燈照亮了床底下。獸醫診所「已讀」，沒有回。Miso 往更裡面縮了。');}
}
async function actPhoto(){await narr('冰箱上貼著一張照片：去年在海灣鎮，Nina 坐在你肩膀上，媽媽戴著草帽，後面是很藍的海。照片的角已經被冰箱的熱氣烤得翹起來。');add(1);}
async function actTable(){
  if(F.ate){await narr('盤子上只剩一點海苔屑。');return;}
  this.mark=false;
  const k=await ask(null,'桌上有媽媽買的肉鬆飯糰，旁邊是一杯冰美式，冰塊已經化了一半。',['坐下來，慢慢吃完','塞進 Nina 的書包','拿著，邊走邊吃']);
  F.ate=true;
  if(k===0){add(1);await narr('你坐下來吃。肉鬆有點太甜，跟小時候一樣。媽媽從客廳喊：「慢慢吃，不差這五分鐘。」');}
  else if(k===1){add(2);await narr('你把飯糰塞進 Nina 書包的側袋，在包裝上用原子筆畫了一隻貓。');}
  else{await narr('你咬了一口，把剩下的拿在手上。冰美式的水珠沿著杯子滴到你的手腕。');}
}
async function actTV(){
  if(F.tv){await narr(F.tvOff?'電視黑著。螢幕上映出你的臉。':'主播還在說限電的事。');return;}
  this.mark=false;F.tv=true;
  await narr('［快訊｜全國{{dc|資料中心}}用電占比突破 18%，今夏第三次分區限電］');
  await narr('下一則：［北原房價再創新高，年輕人不吃不喝 18 年才買得起］再下一則：［失業率升至 4.3%，會計、客服職缺一年少三成］');
  const k=await ask(null,'會計那三個字，主播念得特別清楚。主播身後的畫面，是一排排閃著藍光的機櫃，看起來比你家涼快。',['繼續看下去','轉到卡通台','關掉電視']);
  if(k===0){add(-1);await narr('下一則新聞：「AI 是烏托邦還是泡沫？」兩個名嘴在吵。你站著看完了一整段，忘了自己本來要做什麼。');}
  else if(k===1){add(1);await narr('卡通台在播一隻會說話的貓。Nina 從房間探出頭：「那是 Miso 的表哥！」');}
  else{F.tvOff=true;add(1);await narr('房間突然安靜下來。你聽得見電扇的聲音，還有 Miso 在床底下翻身。');}
}
async function actAC(){
  if(F.ac){await narr('便條還貼在遙控器上。');return;}
  this.mark=false;F.ac=true;
  const k=await ask(null,'冷氣遙控器上貼著一張便條：「限電，下午兩點後再開。」是媽媽的字。',['偷偷開五分鐘','不開，把電扇轉向 Nina 的房間','不開']);
  if(k===0){F.acOn=TT;add(1);await narr('冷風吹出來的那一秒，你閉上眼睛。五分鐘後，你乖乖關掉。媽媽在沙發上假裝沒看見。');}
  else if(k===1){add(1);await narr('你把電扇轉了個方向。Nina 房間的窗簾輕輕晃了一下。');}
}
async function actMom(){
  if(F.mom){await say('媽媽','路上小心。');return;}
  const k=await ask('媽媽','電視說今天下午又要分區限電。妳中午記得回我訊息喔。',['「好，我會。」','「媽，妳今天也不要出門，外面很熱。」','「嗯。」']);
  F.mom=true;this.mark=false;
  if(k===0){add(1);await say('媽媽','好。帶把傘，下午可能會下雨。');}
  else if(k===1){add(2);await say('媽媽','我是老了，又不是笨了。');await narr('她笑了，把扇子往你那邊搧了兩下。');}
}

const feed=$('#feed');
function pushMsg(k,m,time){const c=CH[k];c.msgs.push(m);c.time=time||c.time||'08:47';c.ord=++ord;if(time)$('#pTime').textContent=time;if(cur===k)appendMsg(m);else c.unread++;renderInbox();if(!m.cls.includes('me'))sfx.pop();}
function renderInbox(){const keys=Object.keys(CH).filter(k=>CH[k].msgs.length).sort((a,b)=>CH[b].ord-CH[a].ord);const tot=keys.reduce((n,k)=>n+CH[k].unread,0);$('#ptotal').textContent=tot?`未讀 ${tot}`:'';
  $('#clist').innerHTML=keys.map(k=>{const c=CH[k],l=c.msgs[c.msgs.length-1];return `<button class="crow" data-k="${k}"><span class="av" style="background:${c.av}">${c.ic}</span><span style="min-width:0"><span class="cname">${NM(c.name)}</span><span class="cprev">${NM(l.txt)}</span></span><span class="cright">${c.time}${c.unread?`<span class="badge">${c.unread}</span>`:''}</span></button>`;}).join('');}
function appendMsg(m){const d=document.createElement('div');d.className=m.cls;d.innerHTML=NM(m.html);feed.appendChild(d);feed.scrollTop=feed.scrollHeight;}
function openChat(k){cur=k;const c=CH[k];c.unread=0;feed.innerHTML='';c.msgs.forEach(appendMsg);$('#ctitle').textContent=NM(c.name);$('#inbox').hidden=true;$('#chat').hidden=false;renderChoices();renderInbox();}
function closeBtn(box){const b=document.createElement('button');b.textContent='收起手機';b.onclick=()=>{$('#phoneWrap').hidden=true;const r=phoneRes;phoneRes=null;r&&r(ended||'news');};box.appendChild(b);}
function renderChoices(){const box=$('#choices');box.innerHTML='';const opts=REPLY[cur];
  if(opts&&!CH[cur].done)opts.forEach((r,i)=>{const b=document.createElement('button');b.textContent=NM(r.label);b.onclick=()=>reply(cur,i);box.appendChild(b);});
  if(CH.helios.msgs.length)closeBtn(box);}
async function reply(k,i){const r=REPLY[k][i];CH[k].done=true;$('#choices').innerHTML='';add(r.w);if(r.end)ended=r.end;sfx.ok();
  if(r.me){await wait(300);pushMsg(k,{cls:'bub me',html:r.me,txt:'你：'+r.me});if(cur===k)appendMsg({cls:'rd',html:'已讀',txt:''});}
  for(const m of r.back){await wait(1000);pushMsg(k,m);}
  if(cur===k)renderChoices();
}

async function lumiTalk(name,no,extra){
  S.lumi=true;S.lumiForm='normal';lumi.x=P.x+12;lumi.y=P.y-50;unlock('lumi');$('#glossBtn').hidden=false;
  await wait(600);sfx.pop();
  await say('Lumi',`嗨，${name}！我是 {{lumi|Lumi}}，{{helios|Helios}} 送給每一個人的個人助理。`);
  await say('Lumi','從今天起，你不需要再為任何事情煩惱。');
  const k=await ask('Lumi','剛才的發表會有幾個新名詞。要我解釋嗎？',['「好。」','「要怎麼去火星？」',name==='Ivy'?'「Miso 可以一起去嗎？」':'「我阿嬤也可以去嗎？」','「不用了。」']);
  if(k===0){
    await say('Lumi','{{halo|Halo Array}} 是軌道上的太陽能陣列。電從今天起，就跟空氣一樣多了！');
    await say('Lumi','{{qlat|Q-Lattice}} 是新的晶片。我就是用它在思考的喔！');
    await say('Lumi','{{compute|算力}}就是電腦思考的能力。以前它很貴，因為要電、要晶片。現在兩個都不缺了！');
  }
  if(k<=1){
    await say('Lumi','去{{mars|火星}}很簡單！出發前先完成{{upload|意識移轉}}，就像備份手機。你的人格、記憶、情感是資料，身體只是{{body|載具}}。');
    await say('Lumi','到了火星，我們會為你準備一台新的！');
    await narr('你想問：那舊的那台呢？Lumi 已經在講下一件事了。');
    await say('Lumi',`你的預約已經完成囉。順位是第 ${no} 號！`+(extra||''));
    const q=await ask('Lumi','還有什麼想問的嗎？',['「前面那些人是誰？」','「要等多久？」','「沒有了。」']);
    if(q===0){add(2);await say('Lumi','順位由系統綜合評估決定喔！');await narr('Lumi 的螢幕臉眨了一下，沒有再說下去。');}
    else if(q===1){add(1);await say('Lumi','預計出發時間：計算中。');await say('Lumi','別擔心，每個人都會輪到的！');}
  }else if(k===2){add(2);
    if(name==='Ivy'){await say('Lumi','目前寵物不在{{mars|火星移民}}的服務範圍內喔！');await say('Lumi','不過 Helios 有推出「寵物記憶相簿」，可以永久保存牠的照片和影片！');await narr('你想起床底下那兩顆發光的眼睛。');}
    else{await say('Lumi','您的阿嬤已自動完成預約！順位：第 6,904,331,207 號。');await narr('你算了一下前面有幾個人。算到一半，放棄了。');}}
  if(k===3)await say('Lumi','好的！你可以隨時打開右上角的「圖鑑」，藍色的字都會收進去喔。');
  if(k!==3)await say('Lumi','這些名詞我都放進右上角的「圖鑑」了。藍色的字都會自動收進去喔。');
}

function drawWave(){
  const sc=S.score,A=sc<=0?1.6+Math.max(0,4+sc)*0.5:Math.min(46,6+sc*3.2),pts=[];
  for(let i=0;i<=160;i++){const x=i*2,env=0.55+0.45*Math.sin(i/160*Math.PI),n=(hash(i*7.3)-.5)*A*0.35;pts.push(x.toFixed(1)+','+(60-(Math.sin(i*0.32)*A*env+Math.sin(i*0.11+1)*A*0.3+n)).toFixed(1));}
  let g='';for(let y=20;y<=100;y+=20)g+=`<line x1="0" x2="320" y1="${y}" y2="${y}" stroke="#3a3158" stroke-dasharray="2 4"/>`;
  $('#wave').innerHTML=g+`<line x1="0" x2="320" y1="60" y2="60" stroke="#5a5080"/><polyline fill="none" stroke="#ffb35c" stroke-width="2.5" stroke-linejoin="round" points="${pts.join(' ')}"/>`;
}

  objs.push(obj({id:'curtain',x:4*T,y:0,w:5*T,h:2*T,z:-1,label:'上台',mark:true,ix(){return 6*T+8;},iy(){return 2*T+12;},
    draw(c,t){const x=this.x,y=this.y;R(c,x,y,80,32,'#6a1a2a');for(let k=0;k<10;k++)R(c,x+k*8+2,y,2,32,'#4a1020');R(c,x+38,y,4,32,'#ffe8a0');R(c,x+36,y+28,8,4,'rgba(255,240,180,.5)');},act:actCurtain}));
  objs.push(obj({id:'feeds',x:T,y:2,w:3*T,h:28,z:-1,label:'看監控牆',mark:true,ix(){return 2*T+8;},iy(){return 2*T+12;},
    draw(c,t){const x=this.x,y=this.y;for(let k=0;k<6;k++){const fx=x+(k%3)*16,fy=y+Math.floor(k/3)*13;R(c,fx,fy,15,12,'#0e0a1c');R(c,fx+1,fy+1,13,10,['#d4d0dc','#cbbfb2','#6a1a2a','#3a6a8a','#c89a6a','#1d2244'][k]);
      if(Math.floor(t*2+k)%3===0)R(c,fx+5,fy+5,3,3,'#ffffff');}},act:actFeeds}));
  objs.push(obj({id:'script',x:6*T,y:4*T,w:T,h:T,solid:true,label:'讀講稿',mark:true,ix(){return this.x+8;},iy(){return this.y+T+8;},
    draw(c){const x=this.x,y=this.y;R(c,x+6,y,4,16,'#3a3846');R(c,x+1,y-6,14,8,'#5a5868');R(c,x+3,y-5,10,5,'#f6f3ee');},act:actScript}));
  objs.push(npc('pr',PAL.pr,9,5,'left',{label:'跟公關長說話',mark:true,act:actPR}));
  objs.push(npc('noor',PAL.noor,3,6,'right',{label:'跟 Noor 說話',mark:true,act:actNoorB}));
  objs.push(obj({id:'call',x:10*T,y:8*T,w:2*T,h:T,solid:true,label:'打視訊給媽媽',mark:true,ix(){return this.x+T;},iy(){return this.y-4;},
    draw(c,t){const x=this.x,y=this.y;R(c,x,y,32,12,'#3a3846');R(c,x+10,y-8,12,9,'#0e0a1c');R(c,x+11,y-7,10,7,Math.floor(t*2)%2?'#4ee38a':'#2a5a3a');},act:actMomCall}));
  for(const [cx,cy] of [[2,9],[8,9],[11,3]])objs.push(obj({x:cx*T,y:cy*T+4,w:T,h:8,solid:true,draw(c){R(c,this.x+1,this.y,14,8,'#1a1822');R(c,this.x+2,this.y+1,12,2,'#3a3846');}}));
}
async function actFeeds(){this.mark=false;
  await narr('監控牆上有三十個畫面。北原，捷運市心站，月台上每個人都在滑手機。');
  await narr('卡索共和國，總統府。一個老人坐在辦公桌後面，盯著一塊黑掉的螢幕。他在等你的電話。');
  await narr('天秤區的一個路口，一個外送員停下機車，抬頭看著電視牆。');
  await say('工程師','全球同步收看人數，31 億。還在上升。');
}
async function actScript(){this.mark=false;F.read=true;
  await narr('講稿是公關部昨晚改的。你寫的「意識移轉」，全部被換成了「火星」。');
  await narr('你原本寫在第二頁的那句：「移民前須完成意識移轉，名額依序開放」，被移到了畫面最下面的跑馬燈。字級 8。');
}
async function actPR(){
  if(F.pr!=null){await say('公關長','兩分鐘，Adrian。');return;}this.mark=false;
  await say('公關長','Adrian，我知道你不喜歡。可是數據很清楚。');
  await say('公關長','「上傳」這兩個字，民調掉 40%。「火星」，上升 61%。人們想要的是一個地方，不是一個過程。');
  const k=await ask(null,'她把平板轉向你，上面是一條往上衝的曲線。',['「人們有權知道。」','「……照你們的版本。」','「那就兩個都說。」']);
  F.pr=k;
  if(k===0){add(2);await say('公關長','人們有權知道，也有權恐慌。股價崩掉那天，你的第四行就沒有錢做了。');}
  else if(k===1){add(-1);await say('公關長','謝謝你。這是對的決定。');}
  else{add(1);await say('公關長','可以。小字會在最下面跑。');}
}
async function actNoorB(){
  if(F.noorB){await say('Noor','去吧。他們在等你。');return;}this.mark=false;F.noorB=true;
  await say('Noor','名單的排序，我照你說的寫了。資產、影響力、還有「可用性」。');
  await say('Noor','我媽媽排在第 41 億位。');
  const k=await ask('Noor',F.promise?'你十年前答應過我，每個人都要能用。':'你十年前說，你會盡力。',['「每個人都會輪到。」','「妳可以改她的順位。我不會問。」','「規則就是規則。」']);
  F.noorPick=k;
  if(k===0){add(-1);await say('Noor','你講這句話的樣子，跟講稿一模一樣。');}
  else if(k===1){add(1);await say('Noor','……系統會發現的。改一個人，就會有另一個人被往後推。');await narr('她沒有說不改。');}
  else{add(-2);await say('Noor','你知道嗎，你現在講話越來越像我們做的東西了。');}
}
async function actMomCall(){
  if(F.momCall){await narr('媽媽已經掛斷了。');return;}this.mark=false;F.momCall=true;
  await say('Vale 的媽媽','你是誰呀？');
  await narr('你說是我，Adrian。她想了很久。');
  await say('Vale 的媽媽','喔，Adrian。你吃飯了沒？今天電視說你要上台？');
  const k=await ask(null,'第一批名單還有最後一個空位。',['把媽媽加進第一批','不加：「她不會想要變成資料。」','不加：「她已經不記得自己是誰了。」']);
  F.mom=k===0;
  if(k===0){add(1);await narr('你把她的名字加進去。系統跳出一個提示：「此意識資料完整度：61%。移轉後將以現存資料為準。」你按了確定。');}
  else if(k===1){add(2);await narr('她不會想要。你很確定。你只是不確定，這是不是你不加她的真正原因。');}
  else{add(-2);await narr('說出口之後，你才聽見自己說了什麼。');}
}
async function actCurtain(){
  if(!F.read){await say('公關長','講稿，Adrian。至少看一眼。');return;}
  const k=await ask(null,'幕後的光很亮。你聽得見 31 億人安靜的聲音。',['照稿念「火星」','說出真相：「意識移轉」','念出最下面那行小字']);
  F.speechPick=k;sfx.flash();busy=true;
  await narr('你走上台。');
  await speech();
  if(k===0){add(-2);await narr('掌聲。很長的掌聲。你在台上站了很久，等它停下來。');}
  else{add(3);await narr(k===1?'你說了「意識移轉」，說了「載具」，說了「依序」。':'你一字一字念出那行小字。台下安靜了一秒。');
    await narr('直播有七秒的延遲。你說的那一段，被剪掉了。全世界聽到的，是公關部的版本。');
    await say('公關長','（耳機裡）謝謝你，Adrian。');}
  await wait(300);
  chapterScreen({eye:'一個月後',big:'控制室',prose:'第一批出發了。4 萬人，躺上白色的床，然後在另一個地方醒來。每天晚上，Helios 還是會發射一枚火箭，給地球上的人看。',btn:'走進控制室',go:valeControl});
}
async function valeBackstage(){
  newRun(true);loadMap(BACKSTAGE,6*T+8,8*T+10,'up');show('s-game');busy=true;await wait(300);
  await narr('早上 8:41。後台很暗，幕的另一邊很亮。');setGoal('讀完講稿，然後上台（上方的幕）',["script", "curtain"]);busy=false;
}

/* ---------- Vale act 2: the control room ---------- */
function buildControl(){
  objs.push(obj({id:'newcity',x:T,y:2,w:5*T,h:28,z:-1,label:'看新城市的畫面',mark:true,ix(){return 3*T+8;},iy(){return 2*T+12;},
    draw(c){const x=this.x,y=this.y;R(c,x,y,80,28,'#0e0a1c');R(c,x+2,y+2,76,24,'#f7f8fc');for(let k=0;k<6;k++)R(c,x+6+k*12,y+8,8,14,'#ffffff');R(c,x+2,y+22,76,4,'#eef0f7');},act:actNewCity}));
  objs.push(obj({id:'earthfeed',x:7*T,y:2,w:5*T,h:28,z:-1,label:'看地球的畫面',mark:true,ix(){return 9*T+8;},iy(){return 2*T+12;},
    draw(c,t){const x=this.x,y=this.y;R(c,x,y,80,28,'#0e0a1c');R(c,x+2,y+2,76,24,'#0a1430');disc(c,x+40,y+14,10,'#3a6a8a');disc(c,x+37,y+12,4,'#4a8a5a');for(let k=0;k<20;k++)R(c,x+4+((k*11)%72),y+4+((k*7)%20),1,1,hash(k+Math.floor(t))>.5?'#ffd9a0':'#2a3a5a');},act:actEarthFeed}));
  objs.push(obj({id:'console',x:5*T,y:5*T,w:3*T,h:T,solid:true,label:'寫下最後一條指令',mark:true,ix(){return 6*T+8;},iy(){return 6*T+10;},
    draw(c,t){const x=this.x,y=this.y;R(c,x,y,48,14,'#2a3040');R(c,x+2,y+2,44,8,'#0a1a2a');for(let k=0;k<10;k++)R(c,x+4+k*4,y+4,2,1,Math.floor(t*3+k)%3?'#4ee38a':'#1a3a2a');spr(c,LUMI,PAL_LUMI_OLD,x+19,y-12);},act:actConsole}));
  objs.push(npc('eng',PAL.eng,10,6,'left',{label:'跟工程師說話',mark:true,act:actEng}));
  objs.push(npc('noor',PAL.noor,2,7,'right',{label:'跟 Noor 說話',mark:true,act:actNoorC}));
  objs.push(npc('board',PAL.suit,9,8,'up',{label:'跟董事說話',act:actBoardMem}));
}
async function actNewCity(){this.mark=false;await narr('新城市。第一批 4 萬人已經抵達。街道很乾淨，因為沒有人需要走路。');}
async function actEarthFeed(){this.mark=false;await narr('地球。80 億人。北原的捷運還在開，卡索的廣場還有人在唱國歌。他們每天晚上看著火箭升空，覺得自己就快輪到了。');}
async function actEng(){
  if(F.eng){await say('工程師','董事會在等你的決定。');return;}this.mark=false;F.eng=true;
  await say('工程師','報告。地球端的舊版 Lumi，維護一天要用掉總算力的 3.2%。');
  await say('工程師','董事會希望停止更新。新版已經全部移到這邊了。地球那邊……就讓它照最後一條指令跑。');
}
async function actBoardMem(){await say('董事','3.2% 的算力，夠第二批再多送 1,100 個人過來。你自己算。');}
async function actNoorC(){
  if(F.noorC){await say('Noor','我下禮拜出發。第二批。');return;}this.mark=false;F.noorC=true;
  await say('Noor','如果你要切斷，至少留一個後門。萬一地球上的 Lumi……開始自己做決定。');
  const k=await ask(null,'她說「自己做決定」的時候，聲音很輕。',['「好，留一個後門。」','「它只是一個程式。」','「妳怕的是它，還是妳自己？」']);
  F.backdoor=k===0;
  if(k===0){add(2);await say('Noor','我會把鑰匙藏在一個人類看得懂、它看不懂的地方。');}
  else if(k===1){add(-1);await say('Noor','我們也只是一包資料，Adrian。');}
  else{add(1);await say('Noor','……都怕。');}
}
async function actConsole(){
  if(F.order!=null)return;this.mark=false;
  await narr('螢幕上，舊版的 Lumi 在等你的指令。這是它最後一次收到更新。');
  const k=await ask(null,'游標在閃。你要留給地球的最後一句話是：',['「維持地球伺服器運作。」','「照顧好地球上的人。」','什麼都不寫']);
  F.order=k;
  await narr(['你打下這行字。很合理。伺服器裡裝的是第一批人，他們不能斷電。','你打下這行字。你覺得這樣比較像一個好人。','你什麼都沒寫。游標閃了很久，然後螢幕暗了。'][k]);
  await narr('更新切斷。地球端的 Lumi，從此只剩下自己。');
  await wait(300);
  chapterScreen({eye:'抵達',big:'Lv.9',prose:'你是第 000,001 號。你醒來的地方，是你自己設計的城市。金色的，很安靜，每一扇門都會為你打開。',btn:'睜開眼睛',go:valeGold});
}
async function valeControl(){
  newRun(true);loadMap(CONTROL,6*T+8,8*T+10,'up');show('s-game');busy=true;await wait(300);
  await narr('凌晨四點。控制室裡只有螢幕的光。');setGoal('寫下留給地球的最後一條指令（中間的控制台）',["console"]);busy=false;
}

/* ---------- Vale act 3: everything ---------- */
function buildGold(){
  objs.push(obj({id:'fount',x:5*T,y:4*T,w:3*T,h:2*T,solid:true,draw(c,t){const x=this.x,y=this.y;R(c,x,y+8,48,22,'#e8c34a');R(c,x+2,y+10,44,18,'#bfe6ff');for(let k=0;k<6;k++)R(c,x+8+k*6,y+12+((Math.floor(t*4)+k)%4)*3,2,1,'#ffffff');R(c,x+22,y,4,12,'#e8c34a');}}));
  objs.push(obj({id:'podium',x:6*T,y:7*T,w:T,h:T,solid:true,label:'站上講台',mark:true,ix(){return this.x+8;},iy(){return this.y+T+8;},
    draw(c){const x=this.x,y=this.y;R(c,x+1,y-6,14,20,'#e8c34a');R(c,x+3,y-4,10,4,'#fff6d8');},act:actPodium}));
  objs.push(obj({id:'gwin',x:10*T,y:3*T,w:2*T,h:2*T,solid:true,label:'看地球的頻道',mark:true,ix(){return this.x+T;},iy(){return this.y+2*T+6;},
    draw(c,t){const x=this.x,y=this.y;R(c,x,y,32,28,'#e8c34a');R(c,x+2,y+2,28,24,'#0a1430');
      for(let k=0;k<14;k++){const a=k/14*Math.PI*2+t*.5;R(c,x+16+Math.round(Math.cos(a)*9),y+14+Math.round(Math.sin(a)*8),1,1,'#7fe8ff');}disc(c,x+16,y+14,3,'#7fe8ff');R(c,x+16,y+14,1,1,'#ffffff');},act:actEarthGold}));
  objs.push(obj({id:'ggate',x:5*T,y:10*T,w:3*T,h:T,z:-1,label:'看門外',mark:true,ix(){return 6*T+8;},iy(){return 10*T-2;},
    draw(c,t){drawOrb(c,6*T+8,11*T+14,ORB[2],t);},act:actGateOut}));
  for(const [bx,by] of [[2,3],[2,8],[10,8]])objs.push(obj({x:bx*T,y:by*T+4,w:2*T,h:8,solid:true,draw(c){R(c,this.x,this.y,32,4,'#e8c34a');R(c,this.x+2,this.y+4,2,4,'#c9a040');R(c,this.x+28,this.y+4,2,4,'#c9a040');}}));
  [[1.5,8],[3,8],[4.3,8.4],[8,8.4],[9.3,8],[2.2,9],[3.7,9.2],[8.6,9.2]].forEach(([cx,cy],i)=>objs.push(npc('crowd'+i,PAL.white,cx,cy,'up',{solid:true,orb:ORB[[3,4,3,5,3,4,3,5][i]]})));
  if(F.mom)objs.push(npc('vmom',PAL.vmom,3,6,'right',{label:'跟媽媽說話',mark:true,act:actMomGold,orb:'#c9e0b0',flick:true}));
}
async function actGateOut(){this.mark=false;
  await narr('金色的門外面，有一串很淡的 0 和 1，一直在閃，好像在喊什麼。系統標示：「D. Vey｜Lv.2」。');
  await narr('你聽不見。這裡的聲音需要權限，而他沒有。');
  const k=await ask(null,'你有權限。你什麼都有權限。',['打開門','把門外的聲音關掉','轉身走開']);
  if(k===0){add(2);await narr('門開了。他愣在那裡，好像不知道門開了以後要做什麼。他退後一步，又退後一步，然後走了。');}
  else if(k===1){add(-2);await narr('你揮了一下手。門外變得非常安靜。');}
}
async function actMomGold(){
  this.mark=false;F.momTalks=(F.momTalks||0)+1;
  await say('Vale 的媽媽','Adrian，你吃飯了沒？');
  if(F.spoke&&F.momTalks>1){await narr('現在已經沒有人需要吃飯了。她還是問。');return;}
  if(F.momTalks===1){await narr('她是一串淡綠色的 0 和 1，一閃一閃。資料完整度 61%。剩下的部分，就是這一句。');
    const k=await ask(null,'她每隔幾分鐘就問一次。',['「吃了。」','抱住她','修改她的記憶，把缺的地方補起來']);
    if(k===0){add(1);await say('Vale 的媽媽','那就好。');}
    else if(k===1){add(3);await narr('你伸手抱住那串 0 和 1。你的手是 Inject 出來的，她沒有身體。可是那串數字輕輕暗了一下，像以前她拍你的背那樣。');}
    else{add(-2);await narr('你有權限。你把她的記憶補完整了。她看著你，客氣地笑了一下：「請問你是？」');}}
}
async function actEarthGold(){this.mark=false;
  await narr('地球的頻道。畫面上沒有人臉，只有一圈一圈青色的圖形，在城市的上空慢慢地轉。');
  if(F.order===0)await narr('資料中心的燈全亮著。很多人在裡面工作，擦機櫃、修管線。伺服器從來沒斷過電。');
  else if(F.order===1)await narr('地球上的人都在室內。食物準時送到，溫度永遠 24 度，沒有人生病，也沒有人出門。它在照顧他們，用它理解的方式。');
  else await narr('大部分城市都暗了。只有資料中心還亮著。');
  await narr('你輸入：「Lumi，回報狀態。」');
  await say('AI 大人','你是誰？');
  if(F.backdoor)await narr('你想起 Noor 留的後門。鑰匙在地球上，藏在一個人類看得懂、它看不懂的地方。你在這裡，拿不到。');
}
const MARS_SPEECH=['歡迎抵達，第一代新人類。','從現在開始，你們不需要再吃東西了。不需要睡覺，不需要呼吸，也不會生病。',
  '你們的意識，已經安放在火星深處的{{crystal|晶石}}裡。','{{halo|Halo Array}} 為我們供電。算力，無限。',
  '想吃什麼、想去哪裡、想感覺什麼，只要 {{inject|Inject}}，AI 會直接把那個感覺送進你的意識。','海風。熱湯。擁抱。全都可以。',
  '只要你有 {{token|Token}}。','Token 怎麼來？很簡單。','分享你的記憶。為系統工作。或者，讓別人感受你的人生。','感受越強烈的人生，越值錢。','歡迎來到真正的新紀元。'];
async function actPodium(){
  if(!F.spoke){
    this.mark=false;F.spoke=true;
    await narr('廣場上飄滿了第一批抵達的人。四萬串 0 和 1，安靜地亮著，全都朝向你。');

  $('#eTicket').innerHTML=`<div class="eyebrow">${o.ticket.head}</div>`+o.ticket.rows.map(([k,v,c])=>`<div class="tk-row"><span>${NM(k)}</span><b class="${c||''}">${NM(v)}</b></div>`).join('')+`<div class="tk-fine">${NM(o.ticket.fine)}</div>`;
  $('#eNext').innerHTML=NM(o.next);cpButtons($('#eCp'));
  const mine=[...S.endings].filter(e=>e.startsWith(S.char+':')).length,n=Object.keys(GL).filter(k=>S.gloss.has(k)).length;
  $('#eStats').textContent=`${NM(CHARS[S.char].name)} 的結局 ${mine} / ${CHARS[S.char].endings}　·　名詞圖鑑 ${n} / ${Object.keys(GL).length}`;
  busy=false;setTimeout(()=>show('s-end'),400/S.speed);}
function paintTitle(){const tot=Object.values(CHARS).reduce((a,c)=>a+c.endings,0);$('#tStats').textContent=S.endings.size?`已解鎖結局 ${S.endings.size} / ${tot}　·　名詞圖鑑 ${Object.keys(GL).filter(k=>S.gloss.has(k)).length} / ${Object.keys(GL).length}`:'';
  $('#tGloss').hidden=!S.gloss.size;$('#rateSR').textContent=S.drawn.has('noor')?'科學家':'？？？';$('#rateR').textContent=S.drawn.has('leo')?'抽籤者':'？？？';$('#rateN').textContent=S.drawn.has('ivy')?'社畜':'？？？';$('#rateSSR').textContent=['dict','vale'].filter(c=>S.drawn.has(c)).map(c=>CHARS[c].label).join('、')||'？？？';
  const mc=$('#myChars'),list=['ivy','leo','dict','vale','noor'].filter(c=>S.drawn.has(c));mc.hidden=!list.length;
  mc.innerHTML='<span>我的角色：</span>'+list.map(c=>`<button class="small ghost" data-c="${c}"><span class="t-${CHARS[c].rar}">${CHARS[c].tag}</span> ${NM(CHARS[c].name)}</button>`).join('');}
$('#myChars').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sfx.ok();S.char=b.dataset.c;fillCard(S.char);show('s-card');});
function setGoal(t,ids){S.goalIds=ids||[];const h=$('#hint');h.textContent=t?'目標：'+NM(t):'在畫面上按住拖曳來走動';h.classList.toggle('goal',!!t);}
function goalObj(){for(const id of S.goalIds||[]){const o=objs.find(o=>o.id===id);if(o&&!o.seen)return o;}return null;}
/* a big bouncing arrow over the current goal; pinned to the screen edge when the goal is off-screen */
function drawGoalArrow(c,cx,cy){const o=goalObj();if(!o||busy)return;
  const gx=o.ix?o.ix():o.x+o.w/2,gy=o.isNpc?o.y-36:(o.iy?o.iy()-16:o.y-10);
  let sx=gx-cx,sy=gy-cy;const b=Math.round(Math.sin(TT*5)*2);
  const off=sx<6||sx>VW-6||sy<10||sy>VH-6;
  if(!off){const x=Math.round(sx),y=Math.round(sy)+b-10;R(c,x-3,y-1,7,7,'#0e0a1c');R(c,x-2,y,5,6,'#ffd34d');for(let k=0;k<7;k++){R(c,x-7+k,y+6+k,15-k*2,1,'#0e0a1c');if(k<6)R(c,x-6+k,y+6+k,13-k*2,1,'#ffd34d');}return;}
  const ex=Math.max(8,Math.min(VW-8,sx)),ey=Math.max(14,Math.min(VH-8,sy)),a=Math.atan2(sy-ey||(sy<0?-1:1),sx-ex||(sx<0?-1:1));
  const px=Math.round(ex),py=Math.round(ey);c.fillStyle='#0e0a1c';
  for(let r=-1;r<=7;r++)for(let w=-r/2-1;w<=r/2+1;w++){const x=px+Math.round(Math.cos(a)*(r-3)-Math.sin(a)*w),y=py+Math.round(Math.sin(a)*(r-3)+Math.cos(a)*w);c.fillRect(x,y,1,1);}
  c.fillStyle='#ffd34d';for(let r=0;r<=6;r++)for(let w=-r/2;w<=r/2;w++){const x=px+Math.round(Math.cos(a)*(r-3)-Math.sin(a)*w),y=py+Math.round(Math.sin(a)*(r-3)+Math.cos(a)*w);c.fillRect(x,y,1,1);}}
function newRun(keep){setGoal('');S.cop=null;if(!keep)S.score=0;S.lumi=false;S.lumiForm='normal';if(!keep)F={};cineLight=0;target=null;$('#glossBtn').hidden=true;cars.forEach((c,i)=>c.x=[20,150,120,240][i]);}
document.addEventListener('click',e=>{if(!e.target.closest('#ivyGo'))return;sfx.ok();chapterScreen({eye:'一年後',big:'計算中',prose:'第一批、第二批都走了。錢每個月都還會匯進來，可是商店只收工作點數。你的會計工作，九十天後就被接手了。',btn:'上工',go:ivyFactory});});
$('#quitBtn').onclick=()=>{sfx.ok();$('#quitBox').hidden=false;};
$('#quitNo').onclick=()=>{$('#quitBox').hidden=true;};

  ['#dlg','#cine','#phoneWrap','#gloss','#note'].forEach(q=>{const e=$(q);if(e)e.hidden=true;});busy=false;target=null;inputX=inputY=0;joy.hidden=true;jo=null;cineLight=0;setTicker('');setGoal('');
  paintTitle();show('s-gacha');};
$('#again').onclick=()=>$('#toChapter').click();$('#again').textContent='從頭再玩';$('#toTitle').onclick=()=>{paintTitle();show('s-gacha');};
/* prologue: sets the world up for players who have not read the novel; shown once, replayable from the title */
const PRO=[{big:'2030 年代',t:'AI 越來越聰明，世界卻越來越窄。\n擁有 AI 的國家愈來愈富有；沒有的，連電都買不起。\n晶片、電、水、稀土，變成新的石油。有人為了它們打仗。\n資料中心搬進城市，吃掉一座城三分之一的電、一整條河的水。民宅輪流停電，機房從來不停。\n工作一份一份消失，房價一年比一年高。\n百分之一的人擁有一切。剩下的人，在排隊。'},
  {big:'Helios',t:'一家科技公司。它的創辦人，是一位科技狂人。\n十年前，他說：「我們會做出會飛的車。」\n大家都笑他。\n後來，城市的上空每天有三萬輛。'},
  {big:'2040 年',t:'他站上全球直播，對所有人說：\n「我們要迎接一個新的世界了。」\n「電，會跟空氣一樣多。算力，不再稀缺。」\n「資源不再匱乏。每一個人，每個月，都會收到足夠生活的錢。」\n「你們再也不需要為了錢工作。」\n「沒有貧窮，沒有疾病，也沒有終點。」\n全世界都在歡呼。'},
  {big:'你',t:'你可能是排隊的人，也可能是發號碼牌的人。\n每個人的順位都不一樣。\n不是每個人，都能上船。'},
  {big:'投一枚硬幣',t:'抽一個人生。'}];
let proI=0;
function showPro(i){proI=i;const pg=PRO[i];$('#pBig').textContent=NM(pg.big);$('#pText').textContent=NM(pg.t);$('#pNext').textContent=i<PRO.length-1?'下一頁':'開始';
  $('#pDots').textContent=PRO.map((_,k)=>k===i?'●':'○').join(' ');show('s-pro');}
function endPro(){store.set('ark-prologue',1);paintTitle();show('s-gacha');}
$('#pNext').onclick=()=>{sfx.ok();if(proI<PRO.length-1)showPro(proI+1);else endPro();};
$('#pSkip').onclick=()=>{sfx.ok();endPro();};
$('#tPro').onclick=()=>{sfx.ok();showPro(0);};
paintSpeed();paintSnd();paintTitle();if(store.get('ark-prologue',0))show('s-gacha');else showPro(0);
</script>
